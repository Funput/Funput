[package]
name = "funput-settings"
version = "1.2026.1"
edition = "2024"
description = "Funput Settings & Onboarding (GTK4 + libadwaita) for Linux"
# Outside the root workspace, so [workspace.package] gives it nothing. See the
# same note in platforms/windows/Cargo.toml.
license = "MIT"
publish = false

# Single binary; the name is the contract with packaging — both CMakeLists and the
# funput-settings.desktop launcher expect a `funput-settings` executable.
[[bin]]
name = "funput-settings"
path = "src/main.rs"

# Targets Ubuntu 24.04+ (GTK 4.14 / libadwaita 1.5). Feature gates are kept at the
# minimum we actually use (v4_10 for gtk, v1_5 for AdwAboutDialog + the rows) so the
# crate links against 24.04's system libraries.
[dependencies]
# The Chuyển mã window's logic — reading a batch file by file, naming what a
# conversion costs, writing copies beside the originals. Shared with the Windows
# window so the two cannot drift; see crates/funput-convert/README.md. It re-exports
# `funput_core::charset`, so nothing here ever has to name a `Charset` and the
# `charset` feature stays switched on in exactly one manifest.
funput-convert = { path = "../../../crates/funput-convert" }
# Named for one reason: the casing bar decides which switch to show from *which
# transform* is applied, and asking `casing::index_of(Transform::Title)` is the
# alternative to writing that transform's position in the menu down as a number.
# Windows makes the same edge for the same reason. Only `textcase` — the charset side
# is reached through the re-export above. Considered and rejected: re-exporting
# `textcase` from funput-convert, which would leave the two shells that mirror each
# other spelling one type two different ways.
funput-core = { path = "../../../crates/funput-core", features = ["textcase"] }
# The "Phụ âm đầu mở rộng" letter set — `ExtraOnsetLetters`/`OnsetLetter` — so the
# `extraOnsets` key is read and written by the very type Windows persists it with:
# same spelling, same forward-compatible reading of an unknown letter. Only that
# type is used; this app keeps its own `Settings`, which carries Linux-only keys.
funput-config = { path = "../../../crates/funput-config" }
gtk = { package = "gtk4", version = "0.9", features = ["v4_10"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"

# Pure settings UI — no IME hot path links here, so optimize for size. Matches
# the root workspace profile (excluded packages do not inherit it). Do NOT set
# `panic = "abort"` — repo-wide rule, see the root workspace Cargo.toml.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"
