# Standalone package (excluded from the repo workspace): pulls in slint + the
# `windows` crate, which only build on a Windows target. An empty [workspace]
# table detaches it so `cargo` inside this dir does not attach to the repo root.
[package]
name = "funput-windows"
version = "1.2026.1"
edition = "2021"
description = "Funput for Windows — global keyboard hook + tray + native Slint UI."

[workspace]

[[bin]]
name = "funput"
path = "src/main.rs"

[build-dependencies]
slint-build = "1.17"
winresource = "0.1"

[dependencies]
# Native UI. The Skia renderer (not the default FemtoVG) is required for the Mica
# backdrop: FemtoVG's GL surface has no alpha channel, so transparent pixels turn
# black instead of revealing the DWM material (see src/mica.rs). `raw-window-handle-06`
# exposes `Window::window_handle()`, which window-vibrancy needs. The Fluent (Win11)
# widget style is selected in build.rs.
slint = { version = "1.17", default-features = false, features = [
    "std",
    "accessibility",
    "compat-1-2",
    "backend-winit",
    "unstable-winit-030",
    "renderer-skia",
    "raw-window-handle-06",
] }
# Tray icon + menu — the standalone crate Tauri itself wraps, so no WebView2. The
# menu types come from tray-icon's re-exported `muda` (kept version-matched).
tray-icon = "0.24"
# Launch-at-login (writes the HKCU\...\Run registry value).
auto-launch = "0.6"
# Open external links in the system browser.
open = "5"
# Native Open/Save + message dialogs for config Export/Import (Win32 IFileDialog,
# no WebView).
rfd = "0.17.2"
# Decode the tray PNGs to RGBA for `tray_icon::Icon::from_rgba`.
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
# Auto-update (see src/update.rs): fetch a signed JSON manifest from GitHub
# Releases, verify it with the same Ed25519 key Sparkle uses on macOS, then
# swap the running .exe in place.
ureq = "3" # sync HTTP client (rustls, no OpenSSL); runs on its own thread
ed25519-dalek = "3" # verify the Sparkle-compatible Ed25519 signature
base64 = "0.22" # decode the public key + signature
semver = "1" # compare the manifest version against CARGO_PKG_VERSION
self-replace = "1" # replace the currently running executable (crate `self_replace`)
funput-core = { path = "../../crates/funput-core" }
funput-engine = { path = "../../crates/funput-engine" }
funput-desktop = { path = "../../crates/funput-desktop" }

[target.'cfg(windows)'.dependencies]
# Win11 Mica / Win10 Acrylic backdrop via DWM (see src/mica.rs). Takes a
# raw-window-handle-06 handle, which Slint exposes with the matching feature.
window-vibrancy = "0.8"
# Same version Slint's `raw-window-handle-06` feature pulls; used to read HWND
# for DWM corner preference on the Control Center flyout.
raw-window-handle = "0.6.2"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_Graphics_Dwm",
] }

# Size-first for the shell (the slint UI dominates the binary), speed-first for
# the shared IME crates below — the per-keystroke hot path keeps full
# optimization. Matches the root workspace profile (excluded packages do not
# inherit it). Do NOT set `panic = "abort"` — repo-wide rule, see the root
# workspace Cargo.toml.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"

# The shared engine hot path (funput-core/engine/desktop) stays speed-optimized.
[profile.release.package.funput-core]
opt-level = 3

[profile.release.package.funput-engine]
opt-level = 3

[profile.release.package.funput-desktop]
opt-level = 3
