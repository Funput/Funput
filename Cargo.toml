[workspace]
resolver = "2"
members = [
    "crates/funput-core",
    "crates/funput-config",
    "crates/funput-convert",
    "crates/funput-engine",
    "crates/funput-suggestions",
    "crates/funput-cli",
    "crates/funput-ffi",
    "crates/funput-jni",
    "crates/funput-term",
    "crates/funput-desktop",
]
# Platform shells excluded from the default workspace so `cargo test --workspace`
# stays green on every dev machine; each is built from its own dir on its own OS.
# NOTE: excluded packages do NOT inherit the [profile.release] below — each keeps
# an equivalent profile in its own manifest.
exclude = [
    # Windows shell: pulls in slint + the `windows` crate (Windows target only).
    "platforms/windows",
    # GTK4 Settings app: links system gtk4/libadwaita (Linux only).
    "platforms/linux/settings-gtk",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Funput"]
# These are application crates, not library releases: none has been published and
# the shells consume them by path. Saying so prevents an accidental `cargo publish`
# and lets cargo-deny's wildcard rule work — it refuses to accept versionless path
# dependencies for a crate that claims to be publishable, because crates.io would
# reject that crate anyway. Remove this from any crate genuinely bound for crates.io.
publish = false

# Shared lint policy — every member opts in via `[lints] workspace = true`.
# CI escalates warnings to errors (`cargo clippy -- -D warnings`); the denies
# below are invariants that must hold even in local builds.
[workspace.lints.rust]
# FFI/JNI code must wrap each pointer deref in its own `unsafe` block with a
# SAFETY rationale; a blanket-unsafe fn body would hide new ones.
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# Debug/placeholder constructs must never ship in the engine of five platforms.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# Shipped on all five platforms, so the release profile optimizes for speed first
# and binary size second (measured: libfunput_ffi.dylib 477 KB → 369 KB).
#
# Do NOT set `panic = "abort"`: the FFI/JNI boundaries rely on `catch_unwind` to
# turn an engine panic into a dropped keystroke instead of killing the host IME
# process (see funput-ffi/src/support.rs).
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

# Android alone needs the symbols kept. Play asks for native debug symbols so a
# crash inside libfunput_jni.so names functions instead of addresses, and
# `strip = "symbols"` above throws away the very table it wants. AGP extracts that
# table into the App Bundle's metadata and strips the .so it actually delivers, so
# nothing reaches a device larger than before — but only if cargo left the symbols
# there to extract. `debuginfo` drops DWARF and keeps the table: names, no line
# numbers, a fraction of the size.
[profile.android]
inherits = "release"
strip = "debuginfo"
