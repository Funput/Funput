name: Publish package repo

# Phase-2 distribution: take the .deb/.rpm assets of the latest release and serve
# them as GPG-signed apt + dnf repositories on GitHub Pages, so users get
# `apt/dnf/zypper upgrade` instead of re-downloading. Stateless: each run rebuilds
# the whole repo from the current release's assets (the newest version is all a
# package manager needs to offer an upgrade), so no gh-pages history to maintain.
#
# Prerequisites (one-time, see platforms/linux/packaging/repo/README.md):
#   - Settings → Pages → Source = GitHub Actions.
#   - Secrets GPG_PRIVATE_KEY (ASCII-armored private key) and GPG_PASSPHRASE.
#     The key's uid must be `Funput <hello@funput.app>` (matches %_gpg_name below).
#
# Every trigger below runs on the default branch, and that is a requirement, not a
# coincidence: the `github-pages` environment allows deployments from `main` alone.
# A run at any other ref builds all three repositories and is then rejected at
# `deploy`. `on: release: [released]` was exactly that — a release event always sits
# at `refs/tags/v*` — so the one time it ever fired (v1.2026.75) it rebuilt all three
# and was refused at the last step. It is gone; release.yml's `repo` job dispatches
# this workflow instead, and every path in still lands on `main`.
on:
  # How a release gets here. release.yml publishes with the default GITHUB_TOKEN, and
  # GitHub starts no workflow run for an event that token creates, so the dispatch is
  # also what makes this run at all. It carries the tag it just published.
  repository_dispatch:
    types: [publish-repo]
  # Fortnightly, for the pacman repo alone. Its packages are binaries on a rolling
  # distro: they link the Arch libraries of the build day, so an soname bump in
  # fcitx5, ibus or gtk4 breaks them until something rebuilds. Arch's fcitx5 and
  # ibus packages declare no soname `provides`, so a dependency cannot express
  # that constraint and pacman cannot warn — rebuilding on a schedule is the only
  # thing that actually repairs it, in about two weeks rather than at the next
  # release.
  #
  # The run is stateless and rebuilds every tree from the current release, so the
  # apt and rpm halves simply re-publish what they already had.
  # cron has no "every two weeks", so this is the 1st and 15th: gaps of 14-17 days
  # rather than exactly 14, which is close enough for what it guards against.
  schedule:
    - cron: "0 3 1,15 * *"   # 1st and 15th, 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Served under the funput.app brand via a GitHub Pages custom domain. The CNAME
  # file is written into the Pages artifact (deploy job); DNS needs a CNAME record
  # repo.funput.app -> <owner>.github.io. Override with the REPO_BASE_URL variable
  # if the domain ever changes (keep the trailing slash).
  REPO_URL: ${{ vars.REPO_BASE_URL || 'https://repo.funput.app/' }}

jobs:
  # ---- apt (flat) repo: signed Packages + InRelease -------------------------
  apt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y apt-utils gnupg jq curl

      - name: Download .deb assets from the release
        env:
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.client_payload.tag }}
        run: |
          set -euo pipefail
          mkdir -p tree/deb
          [ -n "$TAG" ] || TAG="$(curl -fsSL "https://api.github.com/repos/$GH_REPO/releases/latest" | jq -r .tag_name)"
          curl -fsSL "https://api.github.com/repos/$GH_REPO/releases/tags/$TAG" \
            | jq -r '.assets[].browser_download_url' | grep '\.deb$' \
            | while read -r u; do ( cd tree/deb && curl -fsSLO "$u" ); done
          ls -l tree/deb

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Build + sign flat apt repo
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          cd tree/deb
          apt-ftparchive packages . > Packages
          gzip -kf Packages
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=Funput \
            -o APT::FTPArchive::Release::Label=Funput \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Architectures="amd64 arm64" \
            -o APT::FTPArchive::Release::Components=main \
            release . > Release
          GPG=(gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE")
          "${GPG[@]}" --clearsign -o InRelease Release
          "${GPG[@]}" -abs -o Release.gpg Release
          # Public key users import to trust the repo.
          gpg --armor --export hello@funput.app > funput.asc

      - uses: actions/upload-artifact@v7
        with:
          name: apt-tree
          path: tree/deb

  # ---- dnf/zypper repo: signed packages + signed repomd ---------------------
  # Runs in Fedora for native rpmsign + createrepo_c.
  rpm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: fedora:latest
    steps:
      - name: Install tools
        run: dnf install -y --setopt=install_weak_deps=False createrepo_c rpm-sign gnupg2 jq curl

      - name: Download .rpm assets from the release
        env:
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.client_payload.tag }}
        run: |
          set -euo pipefail
          mkdir -p tree/rpm
          [ -n "$TAG" ] || TAG="$(curl -fsSL "https://api.github.com/repos/$GH_REPO/releases/latest" | jq -r .tag_name)"
          curl -fsSL "https://api.github.com/repos/$GH_REPO/releases/tags/$TAG" \
            | jq -r '.assets[].browser_download_url' | grep '\.rpm$' \
            | while read -r u; do ( cd tree/rpm && curl -fsSLO "$u" ); done
          ls -l tree/rpm

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Sign packages + build + sign repo
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          # Allow loopback pinentry so gpg can take the passphrase non-interactively.
          mkdir -p "$HOME/.gnupg" && chmod 700 "$HOME/.gnupg"
          echo 'allow-loopback-pinentry' >> "$HOME/.gnupg/gpg-agent.conf"
          gpgconf --kill gpg-agent || true
          # Passphrase in a file (kept out of rpm's arg list; survives %, ", spaces).
          printf '%s' "$GPG_PASSPHRASE" > "$HOME/.gpg-pass"
          # Do NOT redefine %__gpg_sign_cmd: its filename placeholders
          # (%{__plaintext_filename}/%{__signature_filename}) are rpm-internal and
          # only resolve inside rpm's own default command — hand-rolling the command
          # leaves them literal. Instead inject loopback + passphrase through rpm's
          # official extension point and let the default sign command stand.
          {
            echo '%_gpg_name hello@funput.app'
            echo "%_gpg_sign_cmd_extra_args --pinentry-mode loopback --passphrase-file $HOME/.gpg-pass"
          } > "$HOME/.rpmmacros"
          rpm --addsign tree/rpm/*.rpm
          createrepo_c tree/rpm
          gpg --batch --yes --pinentry-mode loopback --passphrase-file "$HOME/.gpg-pass" \
            --detach-sign --armor tree/rpm/repodata/repomd.xml
          rm -f "$HOME/.gpg-pass"

      - uses: actions/upload-artifact@v7
        with:
          name: rpm-tree
          path: tree/rpm

  # ---- pacman repo: signed packages + signed database ------------------------
  # Arch is the one distro with no package in the release assets: it is a rolling
  # source distro, so the .deb/.rpm builds have nothing to offer it. The AUR would be
  # the conventional answer, but uploading there needs an AUR account and Arch has
  # registration paused — so this builds the same three packages from
  # packaging/arch/PKGBUILD.in and serves them as a binary pacman repo, under the
  # same domain and the same GPG key as the apt and dnf trees.
  #
  # The trade-off is inherent and worth knowing: these are binaries linked against
  # the Arch libraries of the build day, on a distro that moves continuously. A
  # soname bump in fcitx5, ibus or gtk4 breaks them until the next release rebuilds.
  #
  # x86_64 only — Arch officially supports no other architecture (Arch Linux ARM is
  # a separate distribution with its own repositories).
  pacman:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: archlinux:base-devel
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git jq curl

      - uses: actions/checkout@v7

      - name: Build the packages from the Arch recipe
        env:
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.client_payload.tag }}
        run: |
          set -euo pipefail
          [ -n "$TAG" ] || TAG="$(curl -fsSL "https://api.github.com/repos/$GH_REPO/releases/latest" | jq -r .tag_name)"
          VERSION="${TAG#v}"
          URL="https://github.com/$GH_REPO/archive/refs/tags/${TAG}.tar.gz"
          SHA="$(curl -fsSL "$URL" | sha256sum | cut -d' ' -f1)"
          # makepkg refuses to run as root, and `-s` shells out to pacman for the
          # declared makedepends, so the build user needs passwordless sudo.
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder

          # Build in the build user's home, NOT inside the checkout. makepkg unpacks
          # the source under its build dir, and settings-gtk is a crate excluded from
          # the root Cargo workspace by path — an unpacked copy nested under the
          # repo's own Cargo.toml is not covered by that exclude, so cargo refuses it
          # with "believes it's in a workspace when it's not".
          install -d -o builder /home/builder/build

          # pkgrel is the build date, not 1. These are binaries, and the scheduled
          # rebuild produces the same pkgver every time — pacman only offers an
          # upgrade when pkgver-pkgrel moves, so the date is what makes a rebuild
          # reach users. All three packages share this run's value, which keeps the
          # exact-version dependency between them satisfiable.
          PKGREL="$(date -u +%Y%m%d)"
          sed -e "s/@VERSION@/${VERSION}/g" -e "s/@SHA256@/${SHA}/g" -e "s/@PKGREL@/${PKGREL}/g" \
            platforms/linux/packaging/arch/PKGBUILD.in > /home/builder/build/PKGBUILD
          chown builder /home/builder/build/PKGBUILD

          su builder -c 'cd ~/build && makepkg -s --noconfirm'
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          ls -l /home/builder/build/*.pkg.tar.zst

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Sign packages + build the database
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gnupg" && chmod 700 "$HOME/.gnupg"
          echo 'allow-loopback-pinentry' >> "$HOME/.gnupg/gpg-agent.conf"
          gpgconf --kill gpg-agent || true
          printf '%s' "$GPG_PASSPHRASE" > "$HOME/.gpg-pass"

          mkdir -p tree/arch/x86_64
          cp /home/builder/build/*.pkg.tar.zst tree/arch/x86_64/

          sign() {
            gpg --batch --yes --pinentry-mode loopback --passphrase-file "$HOME/.gpg-pass" \
              --detach-sign --no-armor "$1"
          }

          # pacman verifies a detached .sig beside each package. Unlike apt and dnf,
          # signing the database alone is not enough: SigLevel applies per package.
          for f in tree/arch/x86_64/*.pkg.tar.zst; do sign "$f"; done

          # repo-add picks up the .sig files and records them in the database. Its
          # own --sign is not used: it shells out to gpg without a loopback
          # pinentry, so it cannot take a passphrase in CI.
          repo-add tree/arch/x86_64/funput.db.tar.gz tree/arch/x86_64/*.pkg.tar.zst

          # repo-add leaves `funput.db` and `funput.files` as symlinks to the
          # .tar.gz files. pacman fetches those names, and the Pages artifact does
          # not carry symlinks, so materialise them as real files — then sign the
          # names pacman actually downloads.
          cd tree/arch/x86_64
          for n in db files; do
            rm -f "funput.$n"
            cp "funput.$n.tar.gz" "funput.$n"
          done
          cd - >/dev/null
          sign tree/arch/x86_64/funput.db
          sign tree/arch/x86_64/funput.files

          rm -f "$HOME/.gpg-pass"
          ls -l tree/arch/x86_64

      - uses: actions/upload-artifact@v7
        with:
          name: pacman-tree
          path: tree/arch

  # ---- Assemble + deploy to Pages -------------------------------------------
  deploy:
    needs: [apt, rpm, pacman]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with: { name: apt-tree, path: public/deb }
      - uses: actions/download-artifact@v8
        with: { name: rpm-tree, path: public/rpm }
      - uses: actions/download-artifact@v8
        with: { name: pacman-tree, path: public/arch }

      - name: Assemble site (index, .repo, public key)
        run: |
          set -euo pipefail
          # The public key was exported into the apt tree; surface it at the root.
          mv public/deb/funput.asc public/funput.asc
          T=platforms/linux/packaging/repo
          sed "s#@REPO_URL@#${REPO_URL}#g" "$T/index.html.in"  > public/index.html
          sed "s#@REPO_URL@#${REPO_URL}#g" "$T/funput.repo.in" > public/funput.repo
          # Custom domain: derive the host from REPO_URL so it tracks the override.
          echo "${REPO_URL}" | sed -E 's#^https?://([^/]+)/?.*#\1#' > public/CNAME
          # Stop Pages' Jekyll from eating dotfiles / repodata dirs.
          touch public/.nojekyll
          find public -maxdepth 2 -type f | sort

      - uses: actions/upload-pages-artifact@v5
        with: { path: public }

      - id: deploy
        uses: actions/deploy-pages@v5
