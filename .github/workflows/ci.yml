name: CI

# The pull-request gate. Nothing here builds or ships — the release workflows own
# that. This only checks that the Rust workspace stays formatted, lint-clean,
# tested and inside the per-file line budget.
#
# The toolchain comes from rust-toolchain.toml (1.97.1 + rustfmt + clippy), so
# bumping the pin moves CI with it. The two excluded shells need system libraries, so
# neither is reachable from the `rust` job: the GTK4 Settings app gets a job of its own
# below, and the Windows shell is covered by build-windows.yml, which runs clippy and
# its tests there because nothing in this file can.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # `funput-config` enables `funput-core/charset`, and `funput-desktop` depends
      # on it, so the three steps above resolve the feature **on** for the whole
      # workspace. That covers the charset module — and leaves nothing checking the
      # build *without* it, which is the shape the iOS and Android keyboards get
      # from their `-p funput-ffi` / `-p funput-jni` scripts.
      #
      # So these two are the inverse of what they used to be. Naming the packages
      # keeps `funput-config` out of the resolve graph, which is what keeps the
      # feature off.
      #
      # Format and the line budget need no second pass: `cargo fmt` walks `mod`
      # items whatever their `cfg`, and check-loc.sh walks the filesystem.
      - name: Clippy (no charset — the mobile shape)
        run: cargo clippy -p funput-core -p funput-ffi --all-targets -- -D warnings

      - name: Test (no charset — the mobile shape)
        run: cargo test -p funput-core -p funput-ffi

      # The other half. `funput-ffi` carries the charset C ABI behind a feature of
      # its own, and nothing above compiles it: the workspace steps do not build
      # `funput-ffi` with it, and the two steps above are the charset-off shape by
      # construction. Without these, the module would ship unbuilt and unlinted.
      - name: Clippy (funput-ffi with convert)
        run: cargo clippy -p funput-ffi --features convert --all-targets -- -D warnings

      - name: Test (funput-ffi with convert)
        run: cargo test -p funput-ffi --features convert

      # Compiling proves charset-off still builds; it does not prove the mobile
      # artifacts are free of it. Two different ways that can go wrong, so two checks.
      #
      # `cargo tree` catches a dependency that drags charset in unconditionally —
      # add `funput-config` to `funput-ffi`'s dependencies and the steps above stay
      # green while the tables quietly land in the keyboard's cdylib.
      #
      # It cannot catch the other one. `funput-ffi`'s own `charset` feature ending up
      # on by default renders no edge at all, so the assertion would pass while
      # saying nothing. Ask the library instead: a default build must export no
      # `funput_charset_*` symbol. The line before it is a positive control — if the
      # symbol lookup itself ever stops working, this fails loudly rather than
      # quietly passing forever.
      #
      # The `cargo build` looks redundant beside the steps above and is not: neither
      # `cargo test` nor `cargo clippy` emits a cdylib, so this is the only step that
      # produces the file being inspected. Naming `target/debug` is safe for the same
      # reason the control exists — a default build puts it exactly there, and were it
      # ever absent the control fails, rather than `! grep` passing on a missing file
      # because it found nothing in nothing.
      - name: charset stays out of the mobile crates
        run: |
          ! cargo tree -p funput-ffi -e features | grep -q charset
          ! cargo tree -p funput-ffi -e features | grep -q convert
          ! cargo tree -p funput-jni -e features | grep -q charset
          cargo build -p funput-ffi
          nm -D --defined-only target/debug/libfunput_ffi.so | grep -q funput_process_char
          ! nm -D --defined-only target/debug/libfunput_ffi.so | grep -q funput_charset
          ! nm -D --defined-only target/debug/libfunput_ffi.so | grep -q funput_convert

      # `include/funput.h` is generated by cbindgen but *committed*, because the
      # consumers that read it build without cargo in the loop: the macOS bridging
      # header, the Linux CMake include path, the iOS xcframework. A committed
      # generated file drifts in silence — the symbol guard above would still pass
      # while a host compiled against a prototype that no longer exists.
      #
      # `cargo install` is cached by rust-cache, so this costs a minute once.
      - name: Install cbindgen
        run: cargo install cbindgen --locked

      - name: Generated header is in sync
        run: bash crates/funput-ffi/scripts/gen-header.sh --check

      - name: Line budget
        run: bash scripts/check-loc.sh

  # The line budgets for the three shell languages, none of which ran anywhere a
  # pull request could see. The Swift ones were called from deploy-ios.yml
  # (`workflow_dispatch`, a manual release) and build-macos.yml (`workflow_call`,
  # from release.yml); the Kotlin ones were called from nothing at all. So an
  # oversized file could sit in main until someone shipped, and two did: a Swift
  # test file at 159 lines with twelve green pull requests stacked on it, and a
  # Kotlin one at 162.
  #
  # Its own job rather than steps in `rust`, so a failure is named for what broke.
  # Every script here is bash, find and wc, so none needs a toolchain and the whole
  # job costs a checkout. It does not build or test either mobile shell — the
  # Android module in particular has no CI at all, which is its own problem and a
  # much larger one than this job.
  shell-line-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Swift, iOS
        run: bash platforms/ios/Scripts/check-swift-loc.sh

      - name: Swift, macOS
        run: bash platforms/macos/scripts/check-swift-loc.sh

      - name: Kotlin, line budget
        run: bash platforms/android/scripts/check-kotlin-loc.sh

      - name: Kotlin, directory layout
        run: bash platforms/android/scripts/check-kotlin-layout.sh

  # The GTK4 Settings app, which also hosts the Chuyển mã window. Excluded from the
  # cargo workspace because it links system gtk4/libadwaita, so the `rust` job above —
  # which deliberately installs no system libraries — cannot see it. Before this job it
  # had no gate at all: build-linux.yml only ran `cargo build --release`, at release
  # time, so a lint failure or a broken test could sit in main for weeks.
  #
  # Dev profile, unlike the Windows shell's `--release`: there is no slint/skia here to
  # recompile, so debug is faster and its cache is separate from the release build
  # anyway. `cargo fmt --all` in the `rust` job does not reach an excluded package,
  # which is why formatting is checked here too.
  settings-gtk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build deps
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: platforms/linux/settings-gtk -> target

      - name: Format
        working-directory: platforms/linux/settings-gtk
        run: cargo fmt -- --check

      - name: Clippy
        working-directory: platforms/linux/settings-gtk
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: platforms/linux/settings-gtk
        run: cargo test

  # The shared Linux code (platforms/linux/common): the settings bridge and the
  # composition state machine both shells drive. It links no Fcitx5 or IBus symbol,
  # so this needs neither framework installed — just CMake, nlohmann/json and cargo
  # for the funput-ffi cdylib the tests call across the C ABI.
  linux-common:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build deps
        run: sudo apt-get update && sudo apt-get install -y cmake nlohmann-json3-dev

      - uses: Swatinem/rust-cache@v2

      - name: Configure
        run: cmake -S platforms/linux -B platforms/linux/build/tests -DFUNPUT_BUILD_TESTS=ON

      - name: Build
        run: cmake --build platforms/linux/build/tests --parallel

      - name: Test
        run: ctest --test-dir platforms/linux/build/tests --output-on-failure

  # Does this pull request touch the AUR recipe? Its own tiny job so the Arch
  # container below is only pulled when it will actually be used — otherwise every
  # unrelated pull request would pay for the image and a full `pacman -Syu`.
  aur-changed:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: check
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # Pull requests only: a push to main has no base to diff against, and
          # this is a review gate rather than a release check.
          if [ -z "${BASE_REF:-}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # No --depth here: checkout already unshallowed the clone, and a shallow
          # fetch of the base would leave `...` without a merge base to work from.
          git fetch origin "$BASE_REF"
          if git diff --name-only "origin/${BASE_REF}...HEAD" \
              | grep -q '^platforms/linux/packaging/aur/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "AUR recipe untouched — skipping the makepkg build."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # The AUR recipe (platforms/linux/packaging/aur/PKGBUILD.in). publish-aur.yml only
  # renders and lints it — a real makepkg run costs a full Rust + GTK4 build in an
  # Arch container, far too much for every release — so the build happens here.
  #
  # It builds the LATEST RELEASED TAG, not this pull request's code: the recipe
  # sources a published GitHub tarball, and a pull request has no tag. So this
  # proves the recipe still works; a CMake-layout change that would break it needs
  # a run against a release made after that change.
  aur:
    needs: aur-changed
    if: needs.aur-changed.outputs.run == 'true'
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git namcap curl jq

      - uses: actions/checkout@v5

      - name: Render the recipe for the latest release
        run: |
          set -euo pipefail
          TAG="$(curl -fsSL "https://api.github.com/repos/${{ github.repository }}/releases/latest" | jq -r .tag_name)"
          VERSION="${TAG#v}"
          URL="https://github.com/${{ github.repository }}/archive/refs/tags/${TAG}.tar.gz"
          SHA="$(curl -fsSL "$URL" | sha256sum | cut -d' ' -f1)"
          mkdir -p aur
          # pkgrel 1: the AUR compiles on the user's machine, so a rebuild without a
          # new pkgver has nothing to fix.
          sed -e "s/@VERSION@/${VERSION}/g" -e "s/@SHA256@/${SHA}/g" -e "s/@PKGREL@/1/g" \
            platforms/linux/packaging/aur/PKGBUILD.in > aur/PKGBUILD

      - name: makepkg
        run: |
          set -euo pipefail
          # makepkg refuses to run as root, and `-s` shells out to pacman for the
          # declared makedepends — so the build user needs passwordless sudo.
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder aur
          su builder -c 'cd aur && makepkg -s --noconfirm'
          namcap aur/*.pkg.tar.zst
          ls -l aur/*.pkg.tar.zst
