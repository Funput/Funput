name: CI

# The pull-request gate: the checks that must pass before anything reaches `main`.
# Nothing here builds or ships — the release workflows own that.
#
# All eight jobs are the repository's required status checks (`changes`, `rust`,
# `shell-line-budget`, `settings-gtk`, `linux-common`, `cargo-deny`, `windows`,
# `android`), so renaming a job here means updating the ruleset on `main` to match,
# or the rule silently stops matching anything and the gate quietly opens.
#
# `changes` is on that list for a reason that is easy to miss. A job skipped by its
# own `if:` reports "skipped", which a required check counts as passing — that is
# exactly what lets `windows` and `android` be filtered while staying required. But
# a job skipped because its DEPENDENCY failed reports "skipped" too. So if `changes`
# broke and were not itself required, both expensive jobs would report skipped, the
# gate would read green, and a pull request could merge having run neither. Being
# required is what closes that.
#
# Only `windows` and `android` are filtered, and only because of what they cost —
# see the `changes` job for the measurements. Every other job runs on every change,
# which is the cheaper thing to reason about.
#
# A check that applies to only some pull requests and reports NOTHING on the rest
# belongs in its own workflow with a `paths:` filter — see arch-recipe.yml — and
# must never be a required check, because a required check that never reports
# blocks the merge forever. That is the opposite trade from the one made here.
#
# The toolchain comes from rust-toolchain.toml (1.98.1 + rustfmt + clippy), so
# bumping the pin moves CI with it. Every shell that links a heavy OS-only
# dependency is excluded from the cargo workspace and so invisible to the `rust`
# job — the GTK4 Settings app and the Slint Windows shell each get a job of their
# own below for exactly that reason.
#
# Not covered here: macOS and iOS. build-macos.yml runs the macOS tests, but only
# at release time, and the iOS suites run nowhere automated at all.

on:
  pull_request:
  push:
    branches: [main]

# Read-only: nothing here writes to the repository, publishes an artifact, or
# touches a release. Set explicitly rather than inherited from the repository
# default, so widening that default never silently widens this workflow's token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # `funput-config` enables `funput-core/charset`, and `funput-desktop` depends
      # on it, so the three steps above resolve the feature **on** for the whole
      # workspace. That covers the charset module — and leaves nothing checking the
      # build *without* it, which is the shape the iOS and Android keyboards get
      # from their `-p funput-ffi` / `-p funput-jni` scripts.
      #
      # So these two are the inverse of what they used to be. Naming the packages
      # keeps `funput-config` out of the resolve graph, which is what keeps the
      # feature off.
      #
      # Format and the line budget need no second pass: `cargo fmt` walks `mod`
      # items whatever their `cfg`, and check-loc.sh walks the filesystem.
      - name: Clippy (no charset — the mobile shape)
        run: cargo clippy -p funput-core -p funput-ffi --all-targets -- -D warnings

      - name: Test (no charset — the mobile shape)
        run: cargo test -p funput-core -p funput-ffi

      # The other half. `funput-ffi` carries the charset C ABI behind a feature of
      # its own, and nothing above compiles it: the workspace steps do not build
      # `funput-ffi` with it, and the two steps above are the charset-off shape by
      # construction. Without these, the module would ship unbuilt and unlinted.
      - name: Clippy (funput-ffi with convert)
        run: cargo clippy -p funput-ffi --features convert --all-targets -- -D warnings

      - name: Test (funput-ffi with convert)
        run: cargo test -p funput-ffi --features convert

      # Compiling proves charset-off still builds; it does not prove the mobile
      # artifacts are free of it. Two different ways that can go wrong, so two checks.
      #
      # `cargo tree` catches a dependency that drags charset in unconditionally —
      # add `funput-config` to `funput-ffi`'s dependencies and the steps above stay
      # green while the tables quietly land in the keyboard's cdylib.
      #
      # It cannot catch the other one. `funput-ffi`'s own `charset` feature ending up
      # on by default renders no edge at all, so the assertion would pass while
      # saying nothing. Ask the library instead: a default build must export no
      # `funput_charset_*` symbol. The line before it is a positive control — if the
      # symbol lookup itself ever stops working, this fails loudly rather than
      # quietly passing forever.
      #
      # The `cargo build` looks redundant beside the steps above and is not: neither
      # `cargo test` nor `cargo clippy` emits a cdylib, so this is the only step that
      # produces the file being inspected. Naming `target/debug` is safe for the same
      # reason the control exists — a default build puts it exactly there, and were it
      # ever absent the control fails, rather than `! grep` passing on a missing file
      # because it found nothing in nothing.
      - name: charset stays out of the mobile crates
        run: |
          ! cargo tree -p funput-ffi -e features | grep -q charset
          ! cargo tree -p funput-ffi -e features | grep -q convert
          ! cargo tree -p funput-jni -e features | grep -q charset
          cargo build -p funput-ffi
          nm -D --defined-only target/debug/libfunput_ffi.so | grep -q funput_process_char
          ! nm -D --defined-only target/debug/libfunput_ffi.so | grep -q funput_charset
          ! nm -D --defined-only target/debug/libfunput_ffi.so | grep -q funput_convert

      # `include/funput.h` is generated by cbindgen but *committed*, because the
      # consumers that read it build without cargo in the loop: the macOS bridging
      # header, the Linux CMake include path, the iOS xcframework. A committed
      # generated file drifts in silence — the symbol guard above would still pass
      # while a host compiled against a prototype that no longer exists.
      #
      # `cargo install` is cached by rust-cache, so this costs a minute once.
      - name: Install cbindgen
        run: cargo install cbindgen --locked

      - name: Generated header is in sync
        run: bash crates/funput-ffi/scripts/gen-header.sh --check

      - name: Line budget
        run: bash scripts/check-loc.sh

  ios-release-signing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Verify iOS release signing commands
        run: python3 platforms/ios/Scripts/tests/test_release_signing.py

  # The line budgets for the three shell languages, none of which ran anywhere a
  # pull request could see. The Swift ones were called from deploy-ios.yml
  # (`workflow_dispatch`, a manual release) and build-macos.yml (`workflow_call`,
  # from release.yml); the Kotlin ones were called from nothing at all. So an
  # oversized file could sit in main until someone shipped, and two did: a Swift
  # test file at 159 lines with twelve green pull requests stacked on it, and a
  # Kotlin one at 162.
  #
  # Its own job rather than steps in `rust`, so a failure is named for what broke.
  # Every script here is bash, find and wc, so none needs a toolchain and the whole
  # job costs a checkout. It does not build or test either mobile shell — the
  # Android module in particular has no CI at all, which is its own problem and a
  # much larger one than this job.
  shell-line-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Swift, iOS
        run: bash platforms/ios/Scripts/check-swift-loc.sh

      - name: Swift, macOS
        run: bash platforms/macos/scripts/check-swift-loc.sh

      - name: Kotlin, line budget
        run: bash platforms/android/scripts/check-kotlin-loc.sh

      - name: Kotlin, directory layout
        run: bash platforms/android/scripts/check-kotlin-layout.sh

  # The shell scripts a stranger is asked to run. `platforms/linux/install.sh` in
  # particular is published as a `curl … | bash` one-liner in the docs and on
  # repo.funput.app, which makes it the most widely *executed* file in the repo and,
  # until this job, the only one with nothing checking it — a syntax error in a
  # branch that only Fedora reaches would ship, and be found by a user with a broken
  # install. `bash -n` parses every path, not just the one this runner would take.
  #
  # `--severity=warning` on purpose: the scripts are clean at shellcheck's default
  # (style/info) level too, but pinning the gate above that keeps a newer shellcheck
  # in the runner image from failing an unrelated pull request over a new stylistic
  # check. Both tools are preinstalled on ubuntu-latest, so this job costs a checkout.
  installer-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Parse
        run: |
          for f in platforms/linux/install.sh platforms/linux/build.sh \
                   platforms/macos/scripts/install.sh platforms/macos/scripts/uninstall.sh \
                   scripts/check-loc.sh; do
            bash -n "$f"
          done

      - name: ShellCheck
        run: |
          shellcheck --version
          shellcheck --severity=warning \
            platforms/linux/install.sh platforms/linux/build.sh \
            platforms/macos/scripts/install.sh platforms/macos/scripts/uninstall.sh \
            scripts/check-loc.sh

      # The installer's own help must not break: it is the first thing anyone runs
      # when the one-liner misbehaves, and it lives in a heredoc no other test opens.
      - name: install.sh --help
        run: bash platforms/linux/install.sh --help

  # The GTK4 Settings app, which also hosts the Chuyển mã window. Excluded from the
  # cargo workspace because it links system gtk4/libadwaita, so the `rust` job above —
  # which deliberately installs no system libraries — cannot see it. Before this job it
  # had no gate at all: build-linux.yml only ran `cargo build --release`, at release
  # time, so a lint failure or a broken test could sit in main for weeks.
  #
  # Dev profile, unlike the Windows shell's `--release`: there is no slint/skia here to
  # recompile, so debug is faster and its cache is separate from the release build
  # anyway. `cargo fmt --all` in the `rust` job does not reach an excluded package,
  # which is why formatting is checked here too.
  settings-gtk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build deps
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: platforms/linux/settings-gtk -> target

      - name: Format
        working-directory: platforms/linux/settings-gtk
        run: cargo fmt -- --check

      - name: Clippy
        working-directory: platforms/linux/settings-gtk
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: platforms/linux/settings-gtk
        run: cargo test

  # The shared Linux code (platforms/linux/common): the settings bridge and the
  # composition state machine both shells drive. It links no Fcitx5 or IBus symbol,
  # so this needs neither framework installed — just CMake, nlohmann/json and cargo
  # for the funput-ffi cdylib the tests call across the C ABI.
  linux-common:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build deps
        run: sudo apt-get update && sudo apt-get install -y cmake nlohmann-json3-dev

      - uses: Swatinem/rust-cache@v2

      - name: Configure
        run: cmake -S platforms/linux -B platforms/linux/build/tests -DFUNPUT_BUILD_TESTS=ON

      - name: Build
        run: cmake --build platforms/linux/build/tests --parallel

      - name: Test
        run: ctest --test-dir platforms/linux/build/tests --output-on-failure

  # Which of the two expensive jobs does this pull request actually need?
  #
  # Only `windows` and `android` are filtered, and the reason is the clock: on the
  # last warm run they took 202s and 247s while the other five finished in 66s of
  # wall time between them. Skipping those two takes an unrelated pull request from
  # 247s to 66s; filtering the rest would save at most 41s more and add five further
  # chances to get a filter wrong. The cheap jobs stay unconditional.
  #
  # No checkout. The GitHub API already knows a pull request's changed files, so
  # this costs one request rather than the full-history clone the old
  # `arch-recipe-changed` job paid for on every run.
  #
  # FAIL-OPEN is the whole safety property. Anything that is not a pull request —
  # a push to main, a tag, a manual dispatch — has nothing to diff against and runs
  # EVERYTHING. That is what makes filtering safe: a filter that wrongly skips a job
  # lets a bad merge through, and the unfiltered run on main catches it minutes
  # later rather than never. Never make this branch fail closed.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      windows: ${{ steps.f.outputs.windows }}
      android: ${{ steps.f.outputs.android }}
    steps:
      - id: f
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${PR:-}" ]; then
            echo "Not a pull request — running everything."
            echo "windows=true" >> "$GITHUB_OUTPUT"
            echo "android=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          FILES="$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')"

          # Shared triggers, deliberately wide. crates/ is the ROOT of the
          # dependency graph — both shells consume it by path — so a change there
          # fans out rather than narrowing. The root manifest carries
          # [workspace.package], the toolchain file pins rustc for everything, and
          # a change to this workflow must run every job it might have altered.
          # Anchored at both ends: the root manifests only. crates/ already covers
          # the members' own Cargo.toml, and settings-gtk's lockfile has no bearing
          # on either shell — an unanchored `Cargo\.lock$` would match it and run
          # both jobs for nothing.
          shared='^(crates/.*|Cargo\.toml|Cargo\.lock|rust-toolchain\.toml|\.github/workflows/ci\.yml)$'

          # Log both outcomes, not just the skip. When a filter misbehaves the
          # question is always "why did it decide that", and a line that only
          # appears on one branch cannot answer it — a job that ran because the
          # filter matched looks identical to one that ran because this fell into
          # the fail-open branch above.
          decide() {
            local hits
            hits="$(printf '%s\n' "$FILES" | grep -E "$shared|$2" || true)"
            if [ -n "$hits" ]; then
              echo "$1: matched $(printf '%s\n' "$hits" | wc -l | tr -d ' ') file(s) —"
              printf '%s\n' "$hits" | sed 's/^/    /'
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "$1: no matching file — skipping."
              echo "$1=false" >> "$GITHUB_OUTPUT"
            fi
          }

          decide windows '^platforms/windows/'
          decide android '^platforms/android/'

  # The deterministic half of cargo-deny: what the dependency graph is allowed to
  # contain, which only changes when a dependency changes. Advisories are NOT here
  # — RUSTSEC publishes continuously and a new entry would redden every open pull
  # request over something none of them touched. audit.yml runs those on a schedule.
  #
  # `licenses` is the reason this job earns its place. Slint is tri-licensed
  # (GPL-3.0-only OR Royalty-free-2.0 OR Software-3.0) and the Windows shell links
  # it; deny.toml allows exactly one of the three, which is what picks one. Without
  # this check that choice is a comment nobody enforces, and a dependency arriving
  # under GPL-3.0 would ship inside an MIT release with nothing to say so.
  #
  # Three trees because there are three lockfiles: the workspace, and the two
  # packages excluded from it. One deny.toml governs all three.
  cargo-deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Workspace
        run: cargo deny --config deny.toml check bans licenses sources

      - name: Windows shell
        run: cargo deny --manifest-path platforms/windows/Cargo.toml --config deny.toml check bans licenses sources

      - name: GTK Settings app
        run: cargo deny --manifest-path platforms/linux/settings-gtk/Cargo.toml --config deny.toml check bans licenses sources

  # The Windows shell (platforms/windows): the Slint IME GUI. Excluded from the
  # cargo workspace because it links the `windows` crate and slint/skia, so the
  # `rust` job cannot see it — and until now nothing on a pull request could. Its
  # clippy and its tests lived only in build-windows.yml, which is `workflow_call`
  # only: they ran at release time, from release.yml. A lint failure there stopped
  # a release rather than the pull request that introduced it, and the comment in
  # build-windows.yml records that happening — two clippy failures sat in the tree
  # until someone ran them by hand.
  #
  # The DEV profile, which is where this deliberately parts company with
  # build-windows.yml. That workflow uses --release because a release `cargo build`
  # follows it in the same job, so sharing the profile keeps one dependency tree.
  # Nothing follows here — there is no `cargo build`, because `clippy
  # --all-targets` already type-checks every target and producing the executable is
  # release.yml's job. So --release would buy nothing and cost a great deal:
  # platforms/windows sets `lto = "fat"`, `codegen-units = 1` and `opt-level = "s"`
  # on its release profile, the three most expensive settings there are, applied to
  # a slint + skia dependency tree. The first run of this job with --release spent
  # 220s in clippy and 248s in test on a cold cache. The dev profile has none of
  # those settings.
  #
  # Keeping `cargo test` rather than lint alone is deliberate: there are 58 test
  # functions across 14 files here, and clippy proves nothing about behaviour. If
  # this job is still too slow once the cache is warm, the answer is to move the
  # test step to an unfiltered nightly run — not to delete the only thing that
  # checks whether the shell works.
  #
  # `cargo fmt --all` in the `rust` job does not reach an excluded package either,
  # which is why formatting is checked here too — the same gap `settings-gtk`
  # closes for its own package. Run from each package directory so formatting
  # includes the platform sources and uses its manifest's Rust 2024 edition.
  windows:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # `key` is not decoration. rust-cache builds its key from the rust version,
      # Cargo.lock and the JOB NAME — not the cargo profile — and build-windows.yml
      # also has a job called `windows`. Without this the two share one entry: the
      # release build writes 673 MB of optimized artifacts, this job restores them
      # as a "full match", cannot use a single one of them because it builds dev,
      # compiles everything from scratch, and then skips saving precisely because
      # the key already matched. That is a cache that can never warm up, and it is
      # what the first two runs of this job were doing.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: platforms/windows -> target
          key: ci-dev

      - name: Format
        working-directory: platforms/windows
        run: cargo fmt -- --check

      - name: Clippy
        working-directory: platforms/windows
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: platforms/windows
        run: cargo test

  # The Android keyboard. It had no CI of any kind — `shell-line-budget` counted
  # its lines and nothing compiled it, so 606 unit tests across six modules had
  # never run anywhere but a maintainer's laptop. That is the largest untested
  # surface in the repository and it runs on a plain ubuntu runner, which is what
  # makes it the cheapest one to close.
  #
  # Three steps rather than one `gradlew` invocation, so a failure is named for
  # what broke. Gradle's build directory is shared within the job, so the second
  # and third reuse the first's compilation rather than repeating it.
  #
  # `testDebugUnitTest` pulls in no Rust: the jniLibs tasks are wired to the
  # variant's native sources, which the JVM unit tests never merge. `assembleDebug`
  # is what cross-compiles funput-jni for both ABIs and packages the .so, so it is
  # the step that fails when a change to crates/ breaks the JNI boundary.
  #
  # `lintDebug` gates on lint *errors*, which is what it did locally when this job
  # was written: 0 errors and 102 warnings. Warnings are deliberately not fatal —
  # turning them on is a cleanup with its own diff, not something to bundle into
  # the commit that first switches the suite on.
  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: platforms/android
    steps:
      - uses: actions/checkout@v7

      # JavaVersion.VERSION_21 in every module's compileOptions.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Validates the checksum of gradle-wrapper.jar as well as caching, which is
      # the reason to prefer it over a bare actions/cache: the wrapper is a binary
      # committed to the repository, and nothing else here would notice it change.
      - uses: gradle/actions/setup-gradle@v6

      # sdkmanager is idempotent, so this is a no-op when the runner image already
      # ships them. Both are pinned by the build: compileSdk is `release(37)` and
      # ime/build.gradle.kts names the NDK version literally.
      #
      # The platform id carries a MINOR version — `platforms;android-37.0`, not
      # `platforms;android-37`. Recent SDK platforms are released as 36.1, 37.0 and
      # so on, and AGP's `release(37)` resolves to 37.0. The unsuffixed id does not
      # exist and sdkmanager reports it as "Failed to find package" rather than as
      # an error, which is how the first run of this job failed.
      - name: Android SDK packages
        run: |
          set -euo pipefail
          # `latest` is a symlink the runner images have carried for years, but it
          # is not guaranteed; fall back to whichever versioned cmdline-tools the
          # image actually ships rather than failing on a missing path.
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          # `yes` is killed by SIGPIPE the moment sdkmanager stops reading, which
          # under `pipefail` is exit 141 and would fail this step every time. The
          # install below keeps pipefail; only the licence prompt opts out.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null
          set -o pipefail
          "$SDKMANAGER" "platforms;android-37.0" "ndk;29.0.14206865"

      # build-rust-jni.sh cross-compiles for both ABIs in ime/build.gradle.kts.
      - name: Rust Android targets
        run: rustup target add aarch64-linux-android x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Assemble (cross-compiles funput-jni for both ABIs)
        run: ./gradlew assembleDebug --console=plain

      - name: Lint
        run: ./gradlew lintDebug --console=plain
