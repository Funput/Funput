name: Release

# One tag → all platforms. Pushing a tag like v1.2026.1 builds the macOS .pkg, the
# Windows .exe, and the Linux .debs — all stamped with the **tag version** (single
# source of truth) — and publishes them to one public GitHub Release.
#
# workflow_dispatch is for testing the *full* pipeline (incl. EdDSA signing + the
# update feeds) without disturbing users:
#   - version empty            → compile-only smoke test (no signing/feed/publish).
#   - version set, publish off → build + sign + emit feeds; artifacts only, no Release.
#   - version set, publish on  → same, plus a **prerelease** (never becomes the
#                                `latest` the auto-updater serves).
#
# The per-platform build steps live in reusable workflows (build-*.yml) and are
# called below; artifacts they upload are gathered by `publish` in the same run.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Build version, e.g. 1.2026.2-rc1. Empty = compile-only smoke test (no signing/feed)."
        required: false
        type: string
        default: ""
      publish:
        description: "Publish a GitHub prerelease with the built artifacts (never becomes `latest`)."
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---- Single source of truth for the version -------------------------------
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          DISPATCH_PUBLISH: ${{ inputs.publish }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # Tag push → full public release.
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            # Manual dispatch → use the provided version (may be empty for a
            # compile-only smoke test). Any publish here is always a prerelease, so
            # it never becomes the `latest` the auto-updater serves.
            echo "version=${DISPATCH_VERSION}" >> "$GITHUB_OUTPUT"
            if [[ "${DISPATCH_PUBLISH}" == "true" && -n "${DISPATCH_VERSION}" ]]; then
              echo "publish=true" >> "$GITHUB_OUTPUT"
            else
              echo "publish=false" >> "$GITHUB_OUTPUT"
            fi
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

  # ---- Per-platform builds (reusable workflows) -----------------------------
  # `secrets: inherit` forwards the signing/notarization secrets each build needs.
  macos:
    needs: version
    uses: ./.github/workflows/build-macos.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  windows:
    needs: version
    uses: ./.github/workflows/build-windows.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  linux:
    needs: version
    uses: ./.github/workflows/build-linux.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  # ---- Publish one release with all artifacts -------------------------------
  publish:
    needs: [version, macos, windows, linux]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Assemble release notes
        run: |
          mkdir -p out
          cp artifacts/macos/* out/ 2>/dev/null || true
          cp artifacts/windows/* out/ 2>/dev/null || true
          cp artifacts/windows-cli/* out/ 2>/dev/null || true
          cp artifacts/windows-feed/* out/ 2>/dev/null || true
          cp artifacts/linux-*/* out/ 2>/dev/null || true
          ls -l out
          {
            echo "## Funput v${{ needs.version.outputs.version }}"
            echo
            echo "📖 **Hướng dẫn cài đặt & kích hoạt cho từng nền tảng:** https://docs.funput.app/docs/install/"
            echo
            echo "### Cài đặt"
            echo "- **iOS** — Tải trên [App Store](https://apps.apple.com/vn/app/id6788829996). Bản thử nghiệm sớm có trên [TestFlight](https://testflight.apple.com/join/E8YRd3sy)."
            echo "- **macOS** — \`Funput-*.pkg\` cài cho toàn máy (cần quyền quản trị), hoặc \`Funput-*.app.zip\` dùng được mà không cần quyền đó."
            echo "- **Windows** — \`Funput-*.exe\` chạy trực tiếp, không cần cài đặt, và tự cập nhật ngay trong ứng dụng."
            echo "- **Linux** — \`.deb\` cho Debian/Ubuntu, \`.rpm\` cho Fedora/openSUSE. Chọn bản **Fcitx5** (\`funput-*\`) hoặc **IBus** (\`funput-ibus-*\`) theo đúng kiến trúc CPU; \`funput-settings-*\` là ứng dụng Cài đặt dùng chung, được cài kèm tự động và có thể dùng cả hai bản cùng lúc."
            echo "- **Android** — Đang trong giai đoạn kiểm thử khép kín, chưa mở đăng ký công khai."
          } > notes.md

      # Create the release as a DRAFT with all assets attached. This repo has
      # "immutable releases" enabled: a published release rejects asset uploads, so
      # we must attach everything while it is still a mutable draft, then publish.
      # `out/*.tar.gz` are the portable Linux trees behind `install.sh --user`.
      # They were built but never attached, so the no-sudo path could not resolve
      # one and always died on "no matching asset".
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            out/*.pkg
            out/*.app.zip
            out/*.exe
            out/*.zip
            out/*.deb
            out/*.rpm
            out/*.tar.gz
            out/appcast.xml
            out/*.json
          body_path: notes.md
          generate_release_notes: true
          draft: true
          # Dispatch runs have no pushed tag, so name it explicitly (the action
          # creates the tag); tag pushes reuse the pushed ref. Dispatch publishes
          # are always prereleases.
          prerelease: ${{ needs.version.outputs.prerelease }}
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.version.outputs.version) }}

      # Flip the draft to published. This bakes the already-attached assets into the
      # now-immutable release, and is the event publish-repo.yml listens for.
      #
      # RELEASE_TOKEN, not github.token: GitHub does not start a workflow run for an
      # event created by the default GITHUB_TOKEN, so publishing with it left
      # `on: release: [released]` silently dead and the package repository stuck one
      # release behind until someone dispatched it by hand. A PAT (contents: write on
      # this repo) makes the event fire. Falls back to the default token when the
      # secret is unset, so a release still publishes — just without the follow-on.
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          # The publish job has no checkout, so tell gh which repo to act on instead
          # of letting it look for a local .git.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.version.outputs.version) }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          if [[ "$PRERELEASE" == "true" ]]; then
            # Prerelease must NOT become the `latest` the auto-updater serves.
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --draft=false --latest
          fi

  # ---- Trigger the Homebrew tap to build + publish bottles ------------------
  # Fires only for a real public release (not prereleases/smoke tests). The tap's
  # `bottle.yml` builds `funput` for macOS arm64/x86_64 + x86_64_linux and commits
  # the updated `bottle do` block. Requires a `HOMEBREW_TAP_TOKEN` secret (a PAT with
  # `contents: write` on Funput/homebrew-tap); skipped automatically if absent.
  homebrew:
    needs: [version, publish]
    if: needs.version.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Dispatch bottle build to Funput/homebrew-tap
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "${TOKEN:-}" ]]; then
            echo "HOMEBREW_TAP_TOKEN not set — skipping tap update." >&2
            exit 0
          fi
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TOKEN}" \
            https://api.github.com/repos/Funput/homebrew-tap/dispatches \
            -d "{\"event_type\":\"release\",\"client_payload\":{\"version\":\"${VERSION}\"}}"

  # ---- Trigger the Scoop bucket to bump its manifest ------------------------
  # Windows analogue of `homebrew`. Fires only for a real public release. The
  # bucket's `bump.yml` points funput.json at the new release zip + sha256 and
  # commits it — instant, no community review (unlike winget public). Requires a
  # `SCOOP_BUCKET_TOKEN` secret (a PAT with `contents: write` on
  # Funput/scoop-funput); skipped automatically if absent.
  scoop:
    needs: [version, publish]
    if: needs.version.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Dispatch manifest bump to Funput/scoop-funput
        env:
          TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "${TOKEN:-}" ]]; then
            echo "SCOOP_BUCKET_TOKEN not set — skipping bucket update." >&2
            exit 0
          fi
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TOKEN}" \
            https://api.github.com/repos/Funput/scoop-funput/dispatches \
            -d "{\"event_type\":\"release\",\"client_payload\":{\"version\":\"${VERSION}\"}}"
