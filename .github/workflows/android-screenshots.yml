name: Android screenshots

# Renders the Android app's screens on the JVM (Robolectric + Roborazzi) and
# attaches the images to the run, so a reviewer can see what a pull request does
# to the UI without installing it.
#
# Its own workflow rather than a job in ci.yml because it only applies to pull
# requests that touch the Android tree, and GitHub filters paths per workflow.
# NOT a required status check, for the same reason as arch-recipe.yml: a
# path-filtered workflow reports nothing on the pull requests it skips, and a
# required check that never reports blocks the merge forever. The `android` job
# in ci.yml already composes every one of these screens in `testDebugUnitTest`,
# so a screen that crashes fails the required gate; this workflow only adds the
# pictures.
#
# It records; ci.yml verifies. FunputUI's goldens live in
# platforms/android/funput-ui/src/test/screenshots and must come from this Linux
# runner: when a component changes on purpose, download the "funput-ui-goldens"
# artifact of this workflow's run on the pull request and commit its contents
# over that directory; the app's screens do the same with "app-goldens" and
# platforms/android/app/src/test/screenshots. Copy only the screens a change meant
# to alter: every re-render differs by a few bytes of rasterisation noise.
on:
  pull_request:
    paths:
      - platforms/android/**
      - .github/workflows/android-screenshots.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: android-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: platforms/android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      # Same packages as the `android` job in ci.yml; see the notes there on the
      # minor-versioned platform id and the licence prompt.
      - name: Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null
          set -o pipefail
          "$SDKMANAGER" "platforms;android-37.0" "ndk;29.0.14206865"

      # The app module depends on :ime, whose build packs the Rust lexicon.
      - name: Rust Android targets
        run: rustup target add aarch64-linux-android x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Record screenshots
        run: ./gradlew :app:recordRoborazziDebug :funput-ui:recordRoborazziDebug --console=plain

      # A failing capture names only its line in the console; the XML keeps the message.
      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: platforms/android/*/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: android-screenshots
          path: platforms/android/app/build/outputs/roborazzi/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v7
        with:
          name: funput-ui-goldens
          path: platforms/android/funput-ui/src/test/screenshots/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v7
        with:
          name: app-goldens
          path: platforms/android/app/src/test/screenshots/
          if-no-files-found: error
          retention-days: 30
