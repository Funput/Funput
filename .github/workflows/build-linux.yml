name: Build Linux

# Reusable: builds the shared UI + Settings app + Fcitx5 addon & IBus engine into
# .debs (Debian/Ubuntu) and .rpms (Fedora/openSUSE), natively per arch (no
# cross-compile) so the package tool records the right shlib deps. arm64 covers
# Apple Silicon VMs (Apple Virtualization) and arm servers. Two packages per arch
# per format: funput (Fcitx5) and funput-ibus (IBus). The `linux` job builds the
# .debs on Ubuntu; the `linux-rpm` job builds the .rpms in a Fedora container so
# GNUInstallDirs resolves the rpm-distro libdir (/usr/lib64) and the deps match
# Fedora package names. Called by release.yml; artifacts (names: linux-<arch> and
# linux-rpm-<arch>) are picked up by its `publish` job.
on:
  workflow_call:
    inputs:
      version:
        description: "Release version (empty for a non-tag smoke test)."
        required: false
        type: string
        default: ""

# Cargo network resilience (see release.yml). Workflow-level env does not cross the
# workflow_call boundary, so each build workflow repeats it.
# Called from release.yml, whose token is `contents: write` so it can publish the
# Release. Nothing in here needs that: it builds, signs and uploads artifacts, and
# the `publish` job in the caller is what writes. A reusable workflow may narrow
# the caller's token but never widen it, so declaring it here is a real reduction.
permissions:
  contents: read

env:
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "5"

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Install build deps
        run: |
          sudo apt-get update
          # Fcitx5 + IBus shell toolchains + JSON, and the GTK4/libadwaita Settings deps.
          sudo apt-get install -y \
            cmake nlohmann-json3-dev \
            fcitx5 libfcitx5core-dev libfcitx5utils-dev libfcitx5config-dev \
            ibus libibus-1.0-dev libglib2.0-dev \
            libgtk-4-dev libadwaita-1-dev librsvg2-dev

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            platforms/linux/settings-gtk -> target

      - name: Stamp version from tag
        if: inputs.version != ''
        run: |
          V="${{ inputs.version }}"
          # Stamp the GUI crate version (shown in the Settings "Giới thiệu" page via
          # CARGO_PKG_VERSION). The .deb version comes separately from -DFUNPUT_VERSION.
          sed -i -E "0,/^version = \".*\"/s//version = \"$V\"/" platforms/linux/settings-gtk/Cargo.toml

      - name: Build Settings app (GTK4 + libadwaita)
        working-directory: platforms/linux/settings-gtk
        run: cargo build --release

      - name: Build addons + .debs
        run: |
          V="${{ inputs.version }}"; V="${V:-1.2026.1}"
          # Each shell is its own CMake project; build into a separate dir so the
          # two CPack runs don't clobber each other.
          for fw in fcitx5 ibus; do
            cmake -S "platforms/linux/$fw" -B "platforms/linux/build/$fw" \
              -DCMAKE_BUILD_TYPE=Release -DFUNPUT_VERSION="$V"
            cmake --build "platforms/linux/build/$fw" --parallel
            ( cd "platforms/linux/build/$fw" && cpack -G DEB )
          done
          # The Settings app, its launcher and its icons, packaged once. Both shells
          # Depend on it at this exact version, so it ships whichever they asked for.
          cmake -S platforms/linux/settings-gtk -B platforms/linux/build/settings-gtk \
            -DFUNPUT_VERSION="$V"
          ( cd platforms/linux/build/settings-gtk && cpack -G DEB )

      - name: Verify .debs (apt can parse them)
        run: |
          # Fail fast instead of shipping a broken package. `--simulate` forces apt
          # to parse the .deb metadata through its own reader.
          #
          # One simulation for the whole set rather than one per package: the shells
          # Depend on funput-settings at this exact version, and resolving a shell on
          # its own would fail on a dependency sitting right there in the same build.
          # CPack also leaves a staging copy under _CPack_Packages/, excluded because
          # naming the same package twice in one apt command is an error.
          mapfile -t debs < <(
            find platforms/linux/build -name '*.deb' -not -path '*/_CPack_Packages/*' | sort
          )
          for f in "${debs[@]}"; do
            echo "== $f =="
            dpkg-deb --info "$f" >/dev/null
          done
          sudo apt-get install --simulate "${debs[@]/#/./}" >/dev/null

      - name: Stage artifact
        run: |
          OUT="$RUNNER_TEMP/out"; mkdir -p "$OUT"
          find platforms/linux/build -name '*.deb' -exec cp {} "$OUT/" \;

      # Portable tarballs for the no-sudo `install.sh --user` path (IBus + Fcitx5).
      # The engine binaries are relocatable (INSTALL_RPATH "$ORIGIN" finds
      # libfunput_ffi.so beside them), so we just repackage the already-built .deb
      # payload into an ~/.local-shaped tree. IBus ships its component manifest as a
      # template with the version pre-filled (install.sh substitutes
      # @IBUS_ENGINE_PATH@ with the real $HOME path); Fcitx5 loads its addon by
      # Library= name, so its .conf files need no rewrite. .deb job only (glibc
      # from ubuntu-latest).
      - name: Stage portable --user tarballs
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"; V="${V:-1.2026.1}"
          ARCH="${{ matrix.arch }}"
          OUT="$RUNNER_TEMP/out"; mkdir -p "$OUT"

          # Assemble a staged dir, tar it, and drop the tarball into $OUT.
          pack() {
            local name="$1"
            tar -C "$RUNNER_TEMP/tarball" -czf "$OUT/${name}.tar.gz" "$name"
            echo "Staged: $name"; ls -l "$OUT/${name}.tar.gz"
          }
          # Files common to both frameworks: Settings binary, icons, desktop entry.
          add_common() {
            local stage="$1"
            mkdir -p "$stage/bin" \
                     "$stage/share/icons/hicolor/scalable/apps" \
                     "$stage/share/icons/hicolor/512x512/apps" \
                     "$stage/share/applications"
            cp platforms/linux/settings-gtk/target/release/funput-settings "$stage/bin/"
            cp assets/svg/funput_logo.svg "$stage/share/icons/hicolor/scalable/apps/funput.svg"
            cp assets/logo.png            "$stage/share/icons/hicolor/512x512/apps/funput.png"
            cp platforms/linux/packaging/funput-settings.desktop "$stage/share/applications/"
          }

          rm -rf "$RUNNER_TEMP/tarball"

          # --- IBus ---
          IBUS="funput-ibus-${V}-${ARCH}-linux"; S="$RUNNER_TEMP/tarball/$IBUS"
          mkdir -p "$S/lib/funput" "$S/share/ibus/component"
          cp platforms/linux/build/ibus/ibus-engine-funput "$S/lib/funput/"
          cp target/release/libfunput_ffi.so               "$S/lib/funput/"
          # Pre-fill the version; leave @IBUS_ENGINE_PATH@ for install.sh to fill.
          sed "s/@FUNPUT_VERSION@/${V}/" platforms/linux/ibus/data/funput.xml.in \
            > "$S/share/ibus/component/funput.xml.in"
          add_common "$S"; pack "$IBUS"

          # --- Fcitx5 ---
          # Addon config is RENAMEd to funput.conf under addon/ (matches the .deb).
          FCITX="funput-fcitx5-${V}-${ARCH}-linux"; S="$RUNNER_TEMP/tarball/$FCITX"
          mkdir -p "$S/lib/fcitx5" "$S/share/fcitx5/addon" "$S/share/fcitx5/inputmethod"
          cp platforms/linux/build/fcitx5/libfunput.so "$S/lib/fcitx5/"
          cp target/release/libfunput_ffi.so           "$S/lib/fcitx5/"
          cp platforms/linux/build/fcitx5/funput-addon.conf "$S/share/fcitx5/addon/funput.conf"
          cp platforms/linux/build/fcitx5/funput.conf       "$S/share/fcitx5/inputmethod/funput.conf"
          add_common "$S"; pack "$FCITX"

      - uses: actions/upload-artifact@v5
        with:
          name: linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/out/*

  # ---- .rpm packages (Fedora container, native per arch) --------------------
  # Mirrors the `linux` job but on Fedora so the rpm-distro libdir (/usr/lib64),
  # the Fcitx5/IBus install dirs, and AUTOREQ shlib deps all resolve against
  # Fedora's layout and package names. Same two packages, .rpm instead of .deb.
  linux-rpm:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    container: fedora:latest
    steps:
      - name: Install build deps
        run: |
          # git/tar for actions/checkout; rpm-build so CPack's RPM generator works;
          # the Fcitx5/IBus/GTK4 -devel packages mirror the apt deps in the `linux`
          # job. curl (replacing curl-minimal) is for the rustup installer below.
          dnf install -y --allowerasing --setopt=install_weak_deps=False \
            git tar gzip which \
            gcc-c++ cmake make rpm-build pkgconf-pkg-config curl \
            nlohmann-json-devel \
            fcitx5-devel \
            ibus-devel glib2-devel \
            gtk4-devel libadwaita-devel librsvg2-devel

      - uses: actions/checkout@v5

      - name: Install Rust (rustup, stable)
        run: |
          # Pin via rustup rather than Fedora's `rust` package so edition 2024 is
          # always supported regardless of what `fedora:latest` currently ships.
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          # Keyed separately from the .deb job (different host/libc) via the suffix.
          key: rpm-${{ matrix.arch }}
          workspaces: |
            . -> target
            platforms/linux/settings-gtk -> target

      - name: Stamp version from tag
        if: inputs.version != ''
        run: |
          V="${{ inputs.version }}"
          sed -i -E "0,/^version = \".*\"/s//version = \"$V\"/" platforms/linux/settings-gtk/Cargo.toml

      - name: Build Settings app (GTK4 + libadwaita)
        working-directory: platforms/linux/settings-gtk
        run: cargo build --release

      - name: Build addons + .rpms
        run: |
          V="${{ inputs.version }}"; V="${V:-1.2026.1}"
          for fw in fcitx5 ibus; do
            cmake -S "platforms/linux/$fw" -B "platforms/linux/build/$fw" \
              -DCMAKE_BUILD_TYPE=Release -DFUNPUT_VERSION="$V"
            cmake --build "platforms/linux/build/$fw" --parallel
            ( cd "platforms/linux/build/$fw" && cpack -G RPM )
          done
          # The Settings app, its launcher and its icons, packaged once. Both shells
          # Depend on it at this exact version, so it ships whichever they asked for.
          cmake -S platforms/linux/settings-gtk -B platforms/linux/build/settings-gtk \
            -DFUNPUT_VERSION="$V"
          ( cd platforms/linux/build/settings-gtk && cpack -G RPM )

      - name: Verify .rpms (rpm can parse them)
        run: |
          # Fail fast instead of shipping a broken package: rpm parses the metadata
          # and we echo the recorded dependencies for the build log.
          find platforms/linux/build -name '*.rpm' | while read -r f; do
            echo "== $f =="
            rpm -qpi "$f" >/dev/null
            rpm -qp --requires "$f"
          done

      - name: Stage artifact
        run: |
          OUT="$RUNNER_TEMP/out"; mkdir -p "$OUT"
          find platforms/linux/build -name '*.rpm' -exec cp {} "$OUT/" \;

      - uses: actions/upload-artifact@v5
        with:
          name: linux-rpm-${{ matrix.arch }}
          path: ${{ runner.temp }}/out/*
