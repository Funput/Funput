[package]
name = "funput-suggestions"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The `en.tsv` → `en.lex` encoder. For funput-lexicon-tool; the keyboards never
# enable it.
lexicon-build = []

[dependencies]
# Only the learn path reads it, to tell a Vietnamese syllable from a slip of the
# thumb. Queries stay clear of it, as the perf invariants require.
funput-core = { path = "../funput-core" }
memmap2 = "0.9.11"
unicode-normalization = "0.1.25"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
proptest = "1.11.0"
tempfile = "3.27.0"

[[bench]]
name = "suggestions"
harness = false
