[package]
name = "funput-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Platform-agnostic logic for hook-based desktop input shells (Windows now)."

[lints]
workspace = true

[dependencies]
funput-engine = { path = "../funput-engine" }
# `ShellState` owns the persisted settings and pushes them into the engine.
funput-config = { path = "../funput-config" }
# `InputMethod`/`ToneStyle` — core types the engine takes but does not re-export.
# `textcase` for bỏ dấu, which the gõ tắt listing sorts by. It is off by default to
# keep it out of the mobile keyboards; this crate only ships in desktop shells.
funput-core = { path = "../funput-core", features = ["textcase"] }
