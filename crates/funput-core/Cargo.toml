[package]
name = "funput-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# The charset tables are dead weight in a keyboard: iOS and Android have no
# converter UI and never call this. Off by default so their builds compile
# byte-identically to before. Enabled by the desktop consumers that need it.
# Adds no dependencies — the zero-runtime-dependency invariant below holds either
# way, and `cargo tree --features charset` is the one-line proof.
[features]
default = []
charset = []
# Changing the case of existing text (chuyển đổi kiểu chữ). Off by default for the
# same reason as `charset`, but deliberately *separate* from it: a keyboard may one
# day want bỏ dấu on the selected text — iOS and Android can both read it — and
# folding the two together would make that cost the four charset codecs. The
# converse holds too: `funput-config` enables `charset` to read a UniKey macro file
# and has no use for this. Adds no dependencies either.
textcase = []

[dependencies]

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
proptest = "1.11.0"

[[bench]]
name = "apply"
harness = false

[[bench]]
name = "advanced_telex"
harness = false
