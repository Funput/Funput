[package]
name = "funput-lexicon-tool"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# Data work run by hand when the English lexicon is refreshed. Nothing here links
# into a shipped binary. The one dependency is the library whose format `pack`
# writes, so the layout is defined in exactly one place.
[dependencies]
funput-suggestions = { path = "../funput-suggestions", features = ["lexicon-build"] }

# Test-only: the shipped Vietnamese syllable list is checked against the engine that
# will consume it, which is the only way to catch a malformed spelling before a
# device sees one. `funput-suggestions` stays independent of the composition engine;
# this crate links into nothing.
[dev-dependencies]
funput-core = { path = "../funput-core" }
