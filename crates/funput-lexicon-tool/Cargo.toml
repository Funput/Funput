[package]
name = "funput-lexicon-tool"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# Data work run by hand when the English lexicon is refreshed. Nothing here links
# into a shipped binary. `funput-suggestions` is the library whose format `pack`
# writes, so the layout is defined in exactly one place; `funput-engine` and
# `funput-core` are what `doubled` types every word through, so the word list it
# writes describes the reverts the engine really makes.
[dependencies]
funput-core = { path = "../funput-core" }
funput-engine = { path = "../funput-engine" }
funput-suggestions = { path = "../funput-suggestions", features = ["lexicon-build"] }

# Test-only: the lookup compares bytes against a lowercase NFC key, so the test
# proves every entry is already written that way.
[dev-dependencies]
unicode-normalization = "0.1.25"
